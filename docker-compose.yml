services:
  max-bot:
    build: .
    container_name: max_bot_app
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - TZ=Europe/Moscow
    # --- Настройки безопасности ---
    security_opt:
      - no-new-privileges:true    # Запрет повышения привилегий
    cap_drop:
      - ALL                       # Сбрасываем все Linux capabilities
    cap_add:
      - NET_BIND_SERVICE          # Разрешаем только привязку к портам (не нужно, если порт >1024)
    read_only: false
    # -------------------------------
    networks:
      - max_net
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  caddy:
    image: caddy:2-alpine
    container_name: max_caddy
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - max-bot
    networks:
      - max_net

volumes:
  caddy_data:
  caddy_config:

networks:
  max_net:
    driver: bridge