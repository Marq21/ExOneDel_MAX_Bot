services:
  max-bot:
    build: .
    container_name: max_bot_app
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "127.0.0.1:8080:8080" # Проброс только на локалхост для отладки
    networks:
      - max_net
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  caddy:
    image: caddy:2-alpine
    container_name: max_caddy
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - max-bot
    networks:
      - max_net

volumes:
  caddy_data:
  caddy_config:

networks:
  max_net:
    driver: bridge